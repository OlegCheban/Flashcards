# Preposition exercises grouped by topic (PrepositionCategory).
#
# sentence     - one gap "..." for the preposition; *word* is bold (Telegram Markdown); no _ ` [ characters.
# answers      - every acceptable answer, the first one is shown on the keyboard.
# distractors  - at least 3 wrong answers; none of them may be acceptable in this sentence.
# explanation  - the rule in Russian, shown after a mistake.
#
# Quote answers and distractors: in YAML 1.1 tools an unquoted on/off is a boolean.
# The content is validated on startup (PrepositionExerciseValidator).

