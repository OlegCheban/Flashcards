server:
  port: 8080

spring:
  application:
    name: WebHookService

  ai:
    retry:
      on-http-codes: [429]
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
    openai:
      api-key: ${AI_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-20b
          temperature: 0.9

  liquibase:
    liquibase-schema: ${LIQUIBASE_SCHEMA:public}
    enabled: false

  datasource:
    url: ${BOT_DB_URL}
    username: ${BOT_DB_USER}
    password: ${BOT_DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 600000
      keepalive-time: 0

telegram:
  webhook-path: ${SERVER_URL}
  bot-name: ${BOT_NAME}
  bot-token: ${BOT_TOKEN}
  webhook-secret: ${WEBHOOK_SECRET:}

speech-synthesis:
  url: https://api.groq.com/openai/v1/audio/speech
  api-key: ${AI_KEY}
  model: canopylabs/orpheus-v1-english
  voice: austin



