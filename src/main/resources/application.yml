server:
  port: 8080

spring:
  application:
    name: WebHookService

  ai:
    retry:
      on-http-codes: [429]
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
    openai:
      api-key: ${AI_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-20b
          temperature: 0.9

  liquibase:
    liquibase-schema: ${LIQUIBASE_SCHEMA:public}
    enabled: false

  datasource:
    url: ${BOT_DB_URL}
    username: ${BOT_DB_USER}
    password: ${BOT_DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 30000
      maximum-pool-size: 2

telegram:
  api-url: "https://api.telegram.org"
  webhook-path: ${SERVER_URL}
  bot-name: ${BOT_NAME}
  bot-token: ${BOT_TOKEN}



